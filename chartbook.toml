[config]
type = "pipeline"
chartbook_format_version = "0.0.2"

[site]
title = "Kelly and Pruitt 2013 Replication"
author = "Zara and Dylan"
copyright = "2025"
logo_path = ""
favicon_path = ""

[pipeline]
id = "P01"
pipeline_name = "Market Expectations in the Cross-Section of Present Values"
pipeline_description = "Replication of Table 1 from Kelly and Pruitt (2013). Uses PLS to extract a factor from book-to-market ratios to predict aggregate market returns and dividend growth."
lead_pipeline_developer = "Zara and Dylan"
contributors = ["Zara", "Dylan"]
software_modules_command = ""
runs_on_grid_or_windows_or_other = "Windows/Linux/MacOS"
git_repo_URL = "https://github.com/zaranip/p01_kelly_pruitt_2013"
README_file_path = "./README.md"

[notebooks]

[dataframes]

[dataframes.crsp_monthly_stock]
dataframe_name = "CRSP Monthly Stock Data"
short_description_df = "Monthly stock prices, returns, and shares outstanding from CRSP."
