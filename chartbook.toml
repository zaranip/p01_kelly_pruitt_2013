data_providers = ["WRDS"]
links_to_data_providers = ["https://wrds-www.wharton.upenn.edu/"]
topic_tags = ["Stock Returns", "Market Data", "CRSP"]
type_of_data_access = "Subscription (WRDS)"
data_license = "WRDS Subscription"
license_expiration_date = "N/A"
